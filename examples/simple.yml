asyncapi: 3.1.0
info:
  title: Demo
  version: 1.0.0
  description: 'Demo Server

    <br/> This specification targets AsyncAPI 3.1. Socket.IO ACKs are modeled as operation
    `reply` messages, with the custom `x-ack` extension kept as an alias.

    Socket.IO-specific transport details may still require application-level interpretation.

    '
servers:
  DEMO_SIO:
    host: localhost:5000
    protocol: socketio
channels:
  root:
    address: /
    messages:
      User_Sign_Up:
        $ref: '#/components/messages/User_Sign_Up'
      User_Sign_Up_Ack:
        $ref: '#/components/messages/User_Sign_Up_Ack'
operations:
  receive_user_sign_up:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/User_Sign_Up'
    description: User sign up
    reply:
      channel:
        $ref: '#/channels/root'
      messages:
      - $ref: '#/channels/root/messages/User_Sign_Up_Ack'
components:
  messages:
    User_Sign_Up:
      name: user_sign_up
      description: User sign up
      payload:
        $ref: '#/components/schemas/UserSignUpRequest'
      examples:
      - name: example
        payload:
          email: bob@gmail.com
          password: '123456'
      x-ack:
        $ref: '#/components/schemas/UserSignUpResponse'
    User_Sign_Up_Ack:
      name: user_sign_up_ack
      description: Socket.IO ACK for user_sign_up
      payload:
        $ref: '#/components/schemas/UserSignUpResponse'
      examples:
      - name: example
        payload:
          error: Invalid request
  schemas:
    NoSpec:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: Specification is not provided
    UserSignUpRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: Request model for user sign up
      properties:
        email:
          description: User email
          examples:
          - bob@gmail.com
          format: email
          title: Email
          type: string
        password:
          description: User password
          examples:
          - '123456'
          title: Password
          type: string
      required:
      - email
      - password
      title: UserSignUpRequest
      type: object
    UserSignUpResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: Response model for user sign up
      properties:
        success:
          default: true
          description: Success status
          title: Success
          type: boolean
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Error message if any
          examples:
          - Invalid request
          title: Error
      title: UserSignUpResponse
      type: object
