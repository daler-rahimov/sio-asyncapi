asyncapi: 3.1.0
info:
  title: Tick-Tack-Toe API
  version: 1.0.0
  description: 'Tick-Tack-Toe Game API

    <br/> This specification targets AsyncAPI 3.1. Socket.IO ACKs are modeled as operation
    `reply` messages, with the custom `x-ack` extension kept as an alias.

    Socket.IO-specific transport details may still require application-level interpretation.

    '
servers:
  TICK_TACK_TOE_BACKEND:
    host: localhost:5000
    protocol: socketio
channels:
  root:
    address: /
    messages:
      Create_Game:
        $ref: '#/components/messages/Create_Game'
      game_created:
        $ref: '#/components/messages/game_created'
      Make_Move:
        $ref: '#/components/messages/Make_Move'
      Make_Move_Ack:
        $ref: '#/components/messages/Make_Move_Ack'
      move_made:
        $ref: '#/components/messages/move_made'
      game_drawn:
        $ref: '#/components/messages/game_drawn'
      game_won:
        $ref: '#/components/messages/game_won'
operations:
  receive_create_game:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/Create_Game'
  send_game_created:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/game_created'
  receive_make_move:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/Make_Move'
    reply:
      channel:
        $ref: '#/channels/root'
      messages:
      - $ref: '#/channels/root/messages/Make_Move_Ack'
  send_move_made:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/move_made'
  send_game_drawn:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/game_drawn'
  send_game_won:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/game_won'
components:
  messages:
    Create_Game:
      name: create_game
      description: ''
    game_created:
      name: game_created
      description: ''
      payload:
        $ref: '#/components/schemas/GameCreatedData'
      examples:
      - name: example
        payload:
          game_id: 1
    Make_Move:
      name: make_move
      description: ''
      payload:
        $ref: '#/components/schemas/MakeMoveData'
      examples:
      - name: example
        payload:
          game_id: 1
          x: 0
          y: 0
      x-ack:
        $ref: '#/components/schemas/MakeMoveAckData'
    Make_Move_Ack:
      name: make_move_ack
      description: Socket.IO ACK for make_move
      payload:
        $ref: '#/components/schemas/MakeMoveAckData'
      examples:
      - name: example
        payload:
          error: Invalid move
    move_made:
      name: move_made
      description: ''
      payload:
        $ref: '#/components/schemas/MoveMadeData'
      examples:
      - name: example
        payload:
          board:
          - - X
            - O
            - ''
          - - ''
            - X
            - ''
          - - ''
            - ''
            - O
          turn: X
    game_drawn:
      name: game_drawn
      description: ''
      payload:
        $ref: '#/components/schemas/GameDrawnData'
    game_won:
      name: game_won
      description: ''
      payload:
        $ref: '#/components/schemas/GameWonData'
      examples:
      - name: example
        payload:
          winner: X
  schemas:
    NoSpec:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: Specification is not provided
    GameCreatedData:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        game_id:
          description: The game id
          title: Game Id
          type: integer
          examples:
          - 1
      required:
      - game_id
      title: GameCreatedData
      type: object
    MakeMoveData:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        game_id:
          description: The game id
          title: Game Id
          type: integer
          examples:
          - 1
        x:
          description: The x coordinate
          title: X
          type: integer
          examples:
          - 0
        y:
          description: The y coordinate
          title: Y
          type: integer
          examples:
          - 0
      required:
      - game_id
      - x
      - y
      title: MakeMoveData
      type: object
    MakeMoveAckData:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: The error message
          title: Error
          examples:
          - Invalid move
      title: MakeMoveAckData
      type: object
    MoveMadeData:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        board:
          description: The game board
          items:
            items:
              type: string
            type: array
          title: Board
          type: array
          examples:
          - - - X
              - O
              - ''
            - - ''
              - X
              - ''
            - - ''
              - ''
              - O
        turn:
          description: The current turn
          title: Turn
          type: string
          examples:
          - X
      required:
      - board
      - turn
      title: MoveMadeData
      type: object
    GameDrawnData:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties: {}
      title: GameDrawnData
      type: object
    GameWonData:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        winner:
          description: The winner
          title: Winner
          type: string
          examples:
          - X
      required:
      - winner
      title: GameWonData
      type: object
