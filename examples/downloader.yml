asyncapi: 3.1.0
info:
  title: Downloader API
  version: 1.0.0
  description: 'Server downloader API

    <br/> This specification targets AsyncAPI 3.1. Socket.IO ACKs are modeled as operation
    `reply` messages, with the custom `x-ack` extension kept as an alias.

    Socket.IO-specific transport details may still require application-level interpretation.

    '
servers:
  DOWNLOADER_BACKEND:
    host: localhost:5000
    protocol: socketio
channels:
  root:
    address: /
    messages:
      Download_File:
        $ref: '#/components/messages/Download_File'
      Download_File_Ack:
        $ref: '#/components/messages/Download_File_Ack'
      Get_Download_List:
        $ref: '#/components/messages/Get_Download_List'
      current_list:
        $ref: '#/components/messages/current_list'
operations:
  receive_download_file:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/Download_File'
    description: '

      Accept request to download file from URL and save to server''s file system.
      </br>

      Requests are **not** executed immediately, but added to queue.

      '
    reply:
      channel:
        $ref: '#/channels/root'
      messages:
      - $ref: '#/channels/root/messages/Download_File_Ack'
  receive_get_download_list:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/Get_Download_List'
    description: '

      Get current list of files to download

      '
  send_current_list:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
    - $ref: '#/channels/root/messages/current_list'
    description: Current list of files to download
components:
  messages:
    Download_File:
      name: download_file
      description: '

        Accept request to download file from URL and save to server''s file system.
        </br>

        Requests are **not** executed immediately, but added to queue.

        '
      payload:
        $ref: '#/components/schemas/DownloadFileRequest'
      examples:
      - name: example
        payload:
          url: https://cdn.pixabay.com/photo/2015/04/23/22/00/tree-736885__480.jpg
          location: /tmp/tree.jpg
      x-ack:
        $ref: '#/components/schemas/DownloadAccepted'
    Download_File_Ack:
      name: download_file_ack
      description: Socket.IO ACK for download_file
      payload:
        $ref: '#/components/schemas/DownloadAccepted'
      examples:
      - name: example
        payload:
          error: Invalid request
    Get_Download_List:
      name: get_download_list
      description: '

        Get current list of files to download

        '
    current_list:
      name: current_list
      description: Current list of files to download
      payload:
        $ref: '#/components/schemas/DownloaderQueueEmitModel'
      examples:
      - name: example
        payload:
          downloader_queue: '[https://cdn.pixabay.com/photo/2015/04/23/22/00/tree-736885__480.jpg]'
  schemas:
    NoSpec:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: Specification is not provided
    DownloadFileRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: Request model for download file
      properties:
        url:
          description: URL to download
          format: uri
          minLength: 1
          title: Url
          type: string
          examples:
          - https://cdn.pixabay.com/photo/2015/04/23/22/00/tree-736885__480.jpg
        location:
          description: Destination local to file system; should be an absolute path
          format: path
          title: Location
          type: string
          examples:
          - /tmp/tree.jpg
        check_hash:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Check Hash
      required:
      - url
      - location
      title: DownloadFileRequest
      type: object
    Data:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        is_accepted:
          default: true
          title: Is Accepted
          type: boolean
      title: Data
      type: object
    DownloadAccepted:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: Response model for download file
      properties:
        success:
          default: true
          description: Success status
          title: Success
          type: boolean
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Error message if any
          title: Error
          examples:
          - Invalid request
        data:
          $ref: '#/components/schemas/Data'
      required:
      - data
      title: DownloadAccepted
      type: object
    DownloaderQueueEmitModel:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: Emit model for current list
      properties:
        downloader_queue:
          description: List of URLs to download
          items:
            format: uri
            minLength: 1
            type: string
          title: Downloader Queue
          type: array
          examples:
          - '[https://cdn.pixabay.com/photo/2015/04/23/22/00/tree-736885__480.jpg]'
      required:
      - downloader_queue
      title: DownloaderQueueEmitModel
      type: object
