name: Build & Test

on:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Install asyncapi-cli
        run: npm install -g @asyncapi/cli

      - name: Validate example AsyncAPI specs
        run: |
          asyncapi validate ./examples/downloader.yml
          asyncapi validate ./examples/simple.yml
          asyncapi validate ./examples/agentic_doc_asyncapi.yml
          asyncapi validate ./examples/chat_gpt_asyncapi.yaml
          asyncapi validate ./examples/asgi_echo.yml

      - name: Run tests
        run: uv run pytest tests -v --cov=sio_asyncapi --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false
