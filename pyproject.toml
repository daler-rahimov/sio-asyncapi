[tool.poetry]
name = "sio_asyncapi"
version = "2.0.0"
description = "Flask SocketIO and asyncio Socket.IO with auto-generated AsyncAPI documentation"
authors = ["Daler Rahimov <daler.edu@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "sio_asyncapi", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
flask-socketio = ">=5.3.2,<6.0"
python-socketio = ">=5.11,<6.0"
pydantic = {extras = ["email"], version = ">=2.0,<3.0"}
pyyaml = ">=6.0,<7.0"
python-engineio = ">=4.3.4,<5.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.2,<9.0"
pytest-asyncio = ">=0.23,<1.0"
pytest-cov = ">=4.0,<7.0"
autopep8 = ">=2.0,<2.4"
codespell = ">=2.2,<3.0"
redis = ">=8.1.0,<9.0"
pylint = ">=2.15.8,<4.0.0"
hypothesis-auto = ">=1.1.4,<2.0"
httpx = ">=0.27,<1.0"

[tool.poetry.scripts]
sio-asyncapi = "sio_asyncapi.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
