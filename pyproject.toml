[project]
name = "sio_asyncapi"
version = "2.0.0"
description = "Flask SocketIO and asyncio Socket.IO with auto-generated AsyncAPI documentation"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daler Rahimov", email = "daler.edu@gmail.com" },
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "flask-socketio>=5.3.2,<6.0",
    "python-socketio>=5.11,<6.0",
    "pydantic[email]>=2.13.4,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-engineio>=4.3.4,<5.0",
]

[project.urls]
Homepage = "https://github.com/daler-rahimov/sio-asyncapi"
Repository = "https://github.com/daler-rahimov/sio-asyncapi"

[project.scripts]
sio-asyncapi = "sio_asyncapi.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.0,<7.0",
    "autopep8>=2.0,<2.4",
    "codespell>=2.2,<3.0",
    "redis>=4.4,<6.0",
    "pylint>=2.15.8,<4.0.0",
    "hypothesis-auto>=1.1.4,<2.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_asyncapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
